# FixFlow — local development & demo stack.
#
#   Infrastructure only (apps run on the host with hot reload):   pnpm infra:up
#   Everything in containers:                                     docker compose up --build
#
# Data lives in named volumes and survives `docker compose down` / restarts.
# Removing volumes (`down -v`) destroys local data — never part of any script here.
# Every port is bound to 127.0.0.1 so nothing is exposed to the local network.

name: fixflow

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://fixflow_app:${FIXFLOW_APP_PASSWORD}@postgres:5432/fixflow
  DATABASE_SYSTEM_URL: postgresql://fixflow_system:${FIXFLOW_SYSTEM_PASSWORD}@postgres:5432/fixflow
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-fixflow-private}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_FORCE_PATH_STYLE: 'true'
  MAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: ${MAIL_FROM:-FixFlow <no-reply@fixflow.local>}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
  # Local demo runs over plain http://localhost, so Secure cookies would be dropped by the browser.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  APP_WEB_URL: ${APP_WEB_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  # Production mode refuses insecure cookies unless explicitly acknowledged (local demo only).
  ALLOW_INSECURE_COOKIES: 'true'
  # Per-IP limits on sign-in/sign-up. Raise only for automated test runs (docs/TESTING.md).
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
  SIGNUP_RATE_LIMIT_PER_MINUTE: ${SIGNUP_RATE_LIMIT_PER_MINUTE:-5}

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio:
    condition: service_healthy
  mailpit:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run node infrastructure/scripts/init-env.mjs first}
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - fixflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?missing}', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - fixflow_redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # MinIO's official images are no longer published on Docker Hub/Quay; Chainguard builds
  # MinIO from source and publishes it publicly (pinned by digest for reproducibility).
  minio:
    image: cgr.dev/chainguard/minio@sha256:cff197fef764642223ef9f4444c903d51aee9b544a7be8bc007fef6b7b00d136
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?missing}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?missing}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - fixflow_miniodata:/data
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ "$$line" == *200* ]]'
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: roles + grants → prisma migrate deploy → demo seed (SEED_DEMO, default true).
  # Idempotent and non-destructive — existing data and volumes are never reset.
  migrate:
    build:
      context: .
      target: migrate
      args:
        APP: '@fixflow/db'
    image: fixflow/migrate:local
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_SUPERUSER_URL: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/postgres
      DATABASE_OWNER_URL: postgresql://fixflow_owner:${FIXFLOW_OWNER_PASSWORD}@postgres:5432/fixflow
      DATABASE_URL: postgresql://fixflow_app:${FIXFLOW_APP_PASSWORD}@postgres:5432/fixflow
      DATABASE_SYSTEM_URL: postgresql://fixflow_system:${FIXFLOW_SYSTEM_PASSWORD}@postgres:5432/fixflow
      FIXFLOW_OWNER_PASSWORD: ${FIXFLOW_OWNER_PASSWORD:?missing}
      FIXFLOW_APP_PASSWORD: ${FIXFLOW_APP_PASSWORD:?missing}
      FIXFLOW_SYSTEM_PASSWORD: ${FIXFLOW_SYSTEM_PASSWORD:?missing}
      SEED_DEMO: ${SEED_DEMO:-true}
      ALLOW_DEMO_SEED: ${SEED_DEMO:-true}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-fixflow-private}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'

  api:
    build:
      context: .
      target: api
      args:
        APP: '@fixflow/api'
    image: fixflow/api:local
    restart: unless-stopped
    environment:
      <<: *app-env
      API_PORT: '4000'
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    depends_on: *app-depends

  # Same image as the API, different entrypoint; scale independently (`--scale worker=2`).
  worker:
    build:
      context: .
      target: api
      args:
        APP: '@fixflow/api'
    image: fixflow/api:local
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      <<: *app-env
      WORKER_HEARTBEAT_FILE: /tmp/fixflow-worker.heartbeat
    healthcheck:
      # Healthy while outbox passes (DB + Redis round-trips) keep completing.
      test: ['CMD', 'node', '-e', "const s=require('fs').statSync(process.env.WORKER_HEARTBEAT_FILE);process.exit(Date.now()-s.mtimeMs<30000?0:1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    depends_on: *app-depends

  web:
    build:
      context: .
      target: web
      args:
        APP: '@fixflow/web'
        # Inlined by Next at build time: server-side API target and the browser's realtime URL.
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-http://localhost:4000}
    image: fixflow/web:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  fixflow_pgdata:
  fixflow_redisdata:
  fixflow_miniodata:
